server:
  port: 8082

spring:
  application:
    name: food-court-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:food_court}
    username: ${DB_USERNAME:plazoleta}
    password: ${DB_PASSWORD:plazoleta}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

users-service:
  base-url: ${USERS_SERVICE_URL:http://localhost:8081}

messaging-service:
  base-url: ${MESSAGING_SERVICE_URL:http://localhost:8083}

jwt:
  # Shared HS256 secret — MUST match users-service so this service can verify its tokens.
  secret: ${JWT_SECRET:change-me-plazoleta-shared-jwt-secret-key-32bytes-min}

appDescription: "food-court-service - Plazoleta de comidas (PRAGMA)"
appVersion: "1.0.0"
